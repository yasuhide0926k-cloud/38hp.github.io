<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香陵祭 38HR模擬店ポータルサイト</title>
  
  <meta property="og:title" content="38HR いちかわハッピーライド">
  <meta property="og:description" content="今年の38HRの模擬店は、ベイマックスのハッピーライドをモチーフとしたアトラクションを実施します！">
  <meta property="og:type" content="website">

  <style>
    /* 【カラーカスタマイズエリア】
       クラスのテーマカラーに合わせて、ここのカラーコードを自由に変更できます！
    */
    :root {
      --main-color: #31708f;         /* ヘッダータイトル・詳細ボタン（青系） */
      --main-color-hover: #245269;   /* 詳細ボタンを押したときの色 */
      --accent-color: #3c763d;       /* 予約フォームボタン（緑系） */
      --accent-color-hover: #2b542c; /* 予約フォームボタンを押したときの色 */
      --bg-color: #ededf0;           /* PCなどの大画面時に左右に見える背景色 */
      --card-bg: rgba(255, 255, 255, 0.95); /* カードの背景（白・半透明） */
      --warn-color: #d9534f;         /* 警告・重要なお知らせ用の赤系 */
    }

    /* 全体のリセット設定 */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh; /* スマホブラウザのツールバー伸縮を完全に吸収する動的単位 */
      width: 100%;
    }

    /* 【画面比率対応】メインコンテナ */
    .phone-container {
      width: 100%;
      max-width: 480px; /* タブレットやPCで見た時の最大幅 */
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #ffffff;
      box-shadow: 0 0 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ヘッダーエリア：38HR タイトル */
    header {
      background-color: #ffffff;
      padding: clamp(12px, 3vh, 24px) 20px;
      text-align: center;
      border-bottom: 1px solid #e1e8ed;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    
    header h1 {
      font-size: clamp(20px, 4vh, 32px);
      color: var(--main-color);
      letter-spacing: 0.15em;
      font-weight: bold;
    }

    /* 写真背景のメインコンテンツエリア */
    .main-content {
      flex: 1;
      /* 背景画像（GitHub上の画像パス、または外部URLに差し替えてください） */
      background-image: linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)), url('https://picsum.photos/id/102/1200/1600');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: clamp(15px, 3vh, 30px) 20px;
      display: flex;
      flex-direction: column;
      gap: clamp(15px, 3vh, 25px);
    }

    /* コンテンツカード */
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: clamp(15px, 3vh, 25px) 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid rgba(49, 112, 143, 0.15);
    }

    /* 説明文タイトルと本文 */
    .card h2 {
      font-size: clamp(16px, 2.4vh, 20px);
      color: #222;
      margin-bottom: 12px;
      border-bottom: 3px solid var(--main-color);
      padding-bottom: 4px;
      display: inline-block;
    }
    
    .card p {
      font-size: clamp(14px, 1.8vh, 16px);
      line-height: 1.6;
      color: #444;
      text-align: justify;
    }

    /* 重要テキストの強調スタイル */
    .alert-text {
      display: block;
      margin-top: 10px;
      font-size: clamp(14px, 1.8vh, 16px);
      font-weight: bold;
      color: var(--warn-color);
    }

    /* ボタン・リンクの配置コンテナ */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ボタンの共通スタイル */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: clamp(12px, 2vh, 16px) 15px;
      background-color: var(--main-color);
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: clamp(15px, 2vh, 17px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
      border: none;
      cursor: pointer;
    }
    
    /* PC表示でのホバー制御 */
    @media (hover: hover) {
      .btn:hover {
        background-color: var(--main-color-hover);
        opacity: 0.95;
      }
    }
    /* タップ・クリックした瞬間の縮小エフェクト */
    .btn:active {
      transform: scale(0.98);
      background-color: var(--main-color-hover);
    }

    /* フォーム用ボタンのカラー適用 */
    .btn-form {
      background-color: var(--accent-color);
    }
    @media (hover: hover) {
      .btn-form:hover {
        background-color: var(--accent-color-hover);
      }
    }
    .btn-form:active {
      background-color: var(--accent-color-hover);
    }

    /* 重要ボタン（注意事項など）のカラー適用 */
    .btn-warn {
      background-color: var(--warn-color);
    }
    .btn-warn:active {
      background-color: #b52b27;
    }

    /* 横画面スマホ・極端に高さの低い特殊端末用のブレイクポイント */
    @media (orientation: landscape) and (max-height: 480px) {
      .phone-container {
        max-width: 100%;
      }
      header {
        padding: 8px 20px;
      }
      .main-content {
        padding: 15px;
        gap: 15px;
      }
      .card {
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <header>
      <h1>38HR模擬店ポータルサイト</h1>
    </header>

    <div class="main-content">
      
      <div class="card">
        <h2>38HR 模擬店概要</h2>
        <p>今年の38HRの模擬店は、ベイマックスのハッピーライドをモチーフとした”38HRいちかわハッピーライド”を実施します！</p>
        <span class="alert-text">⚠️ 入場には事前登録が必要です。</span>
      </div>

      <div class="card">
        <h2>はじめての方へ</h2>
        <div class="btn-container">
          <a href="./attention.html" onclick="openRatioWindow(event, 0.8, 0.6)" class="btn btn-warn">
            予約に関する注意事項 (必ず一読ください)
          </a>  
        </div>
      </div>

      <div class="card">
        <h2>事前予約フォーム</h2>
        <div class="btn-container">
          <a href="./form.html" target="_blank" class="btn btn-form">
            予約フォーム
          </a>
        </div>
      </div>

    </div>
  </div>

  <script>
    function openRatioWindow(event, widthRatio, heightRatio) {
      event.preventDefault(); // 本来のページ遷移をキャンセル
  
      // 画面サイズからピクセル数を計算
      const w = window.innerWidth * widthRatio;
      const h = window.innerHeight * heightRatio;
  
      // 画面中央に配置するための座標計算
      const x = (window.innerWidth - w) / 2;
      const y = (window.innerHeight - h) / 2;
  
      window.open(event.currentTarget.href, 'subwin', `width=${w},height=${h},left=${x},top=${y},resizable=yes,scrollbars=yes`);
    }
  </script>

</body>
</html>
