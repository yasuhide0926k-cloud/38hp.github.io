<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香陵祭 38HR模擬店ポータルサイト</title>
  
  <meta property="og:title" content="38HR いちかわハッピーライド">
  <meta property="og:description" content="今年の38HRの模擬店は、ベイマックスのハッピーライドをモチーフとしたアトラクションを実施します！">
  <meta property="og:type" content="website">

  <style>
    :root {
      --main-color: #31708f;         /* ヘッダータイトル・詳細ボタン（青系） */
      --main-color-hover: #245269;   /* 詳細ボタンを押したときの色 */
      --accent-color: #3c763d;       /* 予約フォームボタン（緑系） */
      --accent-color-hover: #2b542c; /* 予約フォームボタンを押したときの色 */
      --bg-color: #ededf0;           /* PCなどの大画面時に左右に見える背景色 */
      --card-bg: rgba(255, 255, 255, 0.95); /* カードの背景（白・半透明） */
      --warn-color: #d9534f;         /* 警告・重要なお知らせ用の赤系 */
      --time-color: #f0ad4e;         /* 待ち時間表示用のオレンジ系 */
    }

    /* 全体のリセット設定 */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
    }

    /* 【画面比率対応】メインコンテナ */
    .phone-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #ffffff;
      box-shadow: 0 0 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ヘッダーエリア */
    header {
      background-color: #ffffff;
      padding: clamp(12px, 3vh, 24px) 20px;
      text-align: center;
      border-bottom: 1px solid #e1e8ed;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    
    header h1 {
      font-size: clamp(20px, 4vh, 32px);
      color: var(--main-color);
      letter-spacing: 0.15em;
      font-weight: bold;
    }

    /* メインコンテンツエリア */
    .main-content {
      flex: 1;
      background-image: linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)), url('https://drive.google.com/thumbnail?id=1Ov2k8IDo0BSfc4VmGOzNiP4hboT3yg5J&sz=w1200');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: clamp(15px, 3vh, 30px) 20px;
      display: flex;
      flex-direction: column;
      gap: clamp(15px, 3vh, 25px);
    }

    /* コンテンツカード */
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: clamp(15px, 3vh, 25px) 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid rgba(49, 112, 143, 0.15);
    }

    .card h2 {
      font-size: clamp(16px, 2.4vh, 20px);
      color: #222;
      margin-bottom: 12px;
      border-bottom: 3px solid var(--main-color);
      padding-bottom: 4px;
      display: inline-block;
    }
    
    .card p {
      font-size: clamp(14px, 1.8vh, 16px);
      line-height: 1.6;
      color: #444;
      text-align: justify;
    }

    .alert-text {
      display: block;
      margin-top: 10px;
      font-size: clamp(14px, 1.8vh, 16px);
      font-weight: bold;
      color: var(--warn-color);
    }

    /* 待ち時間表示用の特大デザイン */
    .waiting-display {
      text-align: center;
      padding: 10px 0;
    }
    .waiting-time {
      font-size: clamp(36px, 6vh, 48px);
      font-weight: 900;
      color: var(--time-color);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
      margin: 5px 0;
    }

    /* ボタンコンテナ */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ボタンの共通スタイル */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: clamp(12px, 2vh, 16px) 15px;
      background-color: var(--main-color);
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: clamp(15px, 2vh, 17px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
      border: none;
      cursor: pointer;
    }
    
    @media (hover: hover) {
      .btn:hover { background-color: var(--main-color-hover); opacity: 0.95; }
    }
    .btn:active { transform: scale(0.98); background-color: var(--main-color-hover); }

    .btn-warn { background-color: var(--warn-color); }
    .btn-warn:active { background-color: #b52b27; }

    /* 🔒 管理者用隠しエリアのスタイル */
    .admin-trigger {
      text-align: center;
      margin-top: 15px;
    }
    .admin-link {
      font-size: 11px;
      color: rgba(0, 0, 0, 0.25); /* 目立たない極薄のグレー */
      text-decoration: none;
      cursor: pointer;
      user-select: none;
    }
    
    .admin-panel {
      display: none; /* 通常は非表示 */
      background-color: #222;
      color: #fff;
      border-radius: 14px;
      padding: 15px;
      margin-top: 15px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .admin-panel h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #f0ad4e;
      text-align: center;
    }
    .grid-inputs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .btn-select-time {
      background-color: #444;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 4px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-select-time:active {
      background-color: #f0ad4e;
      color: #222;
    }
    /* 通信中の連打防止デザイン */
    .btn-select-time:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (orientation: landscape) and (max-height: 480px) {
      .phone-container { max-width: 100%; }
      header { padding: 8px 20px; }
      .main-content { padding: 15px; gap: 15px; }
      .card { padding: 15px; }
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <header>
      <h1>38HR模擬店ポータルサイト</h1>
    </header>

    <div class="main-content">
      
      <div class="card">
        <h2>38HR 模擬店概要</h2>
        <p>今年の38HRの模擬店は、ベイマックスのハッピーライドをモチーフとした”38HRいちかわハッピーライド”！</p>
        <p>なんか「いち」ばん「かわ」ってる先生、「いちかわ」の手作りコーヒーカップ！</p>
      </div>

      <div class="card">
        <div class="btn-container">
          <a href="./attention.html" onclick="openRatioWindow(event, 0.8, 0.6)" class="btn btn-warn">
            来場に関する注意事項 (必ず一読ください)
          </a>  
        </div>
      </div>

      <div class="card">
        <h2>現在の予想待ち時間</h2>
        <div class="waiting-display">
          <p>ただいまの待ち時間の目安は</p>
          <div class="waiting-time" id="current-wait">読込中...</div>
          <p>となっております。</p>
        </div>
      </div>

      <div class="admin-trigger">
        <span class="admin-link" onclick="checkAdminPassword()">管理者ログイン</span>
      </div>

      <div class="admin-panel" id="admin-panel">
        <h3>【管理者用】待ち時間変更パネル</h3>
        <div class="grid-inputs">
          <button class="btn-select-time" onclick="setWaitingTime('一旦休止中（数分程度）')">一旦休止中（数分程度）</button>
          <button class="btn-select-time" onclick="setWaitingTime('5分未満')">5分未満</button>
          <button class="btn-select-time" onclick="setWaitingTime('5分')">5分</button>
          <button class="btn-select-time" onclick="setWaitingTime('10分')">10分</button>
          <button class="btn-select-time" onclick="setWaitingTime('15分')">15分</button>
          <button class="btn-select-time" onclick="setWaitingTime('20分')">20分</button>
          <button class="btn-select-time" onclick="setWaitingTime('25分')">25分</button>
          <button class="btn-select-time" onclick="setWaitingTime('30分')">30分</button>
          <button class="btn-select-time" onclick="setWaitingTime('35分')">35分</button>
          <button class="btn-select-time" onclick="setWaitingTime('40分')">40分</button>
          <button class="btn-select-time" onclick="setWaitingTime('45分')">45分</button>
          <button class="btn-select-time" onclick="setWaitingTime('50分')">50分</button>
          <button class="btn-select-time" onclick="setWaitingTime('55分')">55分</button>
          <button class="btn-select-time" onclick="setWaitingTime('60分')">60分</button>
          <button class="btn-select-time" onclick="setWaitingTime('65分')">65分</button>
          <button class="btn-select-time" onclick="setWaitingTime('70分')">70分</button>
          <button class="btn-select-time" onclick="setWaitingTime('75分')">75分</button>
          <button class="btn-select-time" onclick="setWaitingTime('80分')">80分</button>
          <button class="btn-select-time" onclick="setWaitingTime('85分')">85分</button>
          <button class="btn-select-time" onclick="setWaitingTime('90分')">90分</button>
          <button class="btn-select-time" onclick="setWaitingTime('新規受付終了')">新規受付終了</button>
          <button class="btn-select-time" style="grid-column: span 3; background-color: #d9534f;" onclick="setWaitingTime('60分以上待ち')">91分以上待ち</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 注意事項をポップアップで開く設定
    function openRatioWindow(event, widthRatio, heightRatio) {
      event.preventDefault();
      const w = window.innerWidth * widthRatio;
      const h = window.innerHeight * heightRatio;
      const x = (window.innerWidth - w) / 2;
      const y = (window.innerHeight - h) / 2;
      window.open(event.currentTarget.href, 'subwin', `width=${w},height=${h},left=${x},top=${y},resizable=yes,scrollbars=yes`);
    }

    // 🔗 【重要】ここにステップ1で作ったGASのURLを貼り付けてください！
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxqy8CTh9RYcZpVsgiMc0lELghNnEDTfAhIyxFfHna5jLKz841hIFtfwoQw50raqro6/exec";
    
    // 🔑 管理者パスワード
    const ADMIN_PASSWORD = "38yappy";

    // ページを読み込んだ時に、クラウドから最新の待ち時間を取得する
    window.onload = function() {
      fetch(`${GAS_API_URL}?action=get`)
        .then(response => response.json())
        .then(data => {
          if (data.status === "success") {
            document.getElementById("current-wait").innerText = data.time;
          } else {
            document.getElementById("current-wait").innerText = "取得エラー";
          }
        })
        .catch(error => {
          console.error("通信エラー:", error);
          document.getElementById("current-wait").innerText = "通信エラー";
        });
    };

    // パスワード入力の処理
    function checkAdminPassword() {
      const input = prompt("管理者のパスワードを入力してください：");
      if (input === ADMIN_PASSWORD) {
        alert("認証に成功しました。変更パネルを表示します。");
        document.getElementById("admin-panel").style.display = "block";
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      } else if (input !== null) {
        alert("パスワードが違います。");
      }
    }

    // クラウド（スプレッドシート）上の待ち時間を書き換える処理
    function setWaitingTime(timeString) {
      // 通信中のボタン連打を防止
      const buttons = document.querySelectorAll('.btn-select-time');
      buttons.forEach(btn => btn.disabled = true);
      document.getElementById("current-wait").innerText = "更新中...";

      // GASにデータを送信して書き換え
      fetch(`${GAS_API_URL}?action=set&time=${encodeURIComponent(timeString)}`)
        .then(response => response.json())
        .then(data => {
          if (data.status === "success") {
            document.getElementById("current-wait").innerText = data.time;
            alert("待ち時間を【 " + data.time + " 】に変更し、全員の画面へ反映しました！");
          } else {
            alert("更新に失敗しました。");
          }
        })
        .catch(error => {
          console.error("更新エラー:", error);
          alert("通信エラーが発生しました。");
          document.getElementById("current-wait").innerText = "エラー";
        })
        .finally(() => {
          // 通信が終わったらボタンを再び押せるようにする
          buttons.forEach(btn => btn.disabled = false);
        });
    }
  </script>

</body>
</html>
