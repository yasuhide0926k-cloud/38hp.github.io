<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>チケット予約 | 模擬店システム</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background: #eef2f3; font-family: sans-serif; }
    .main-card { max-width: 500px; margin: 30px auto; border: none; border-radius: 20px; }
    .qr-area { background: #fff; padding: 20px; border-radius: 15px; border: 3px dashed #007bff; }
  </style>
</head>
<body>

  <div class="container p-2">
    <div id="form-section" class="card main-card shadow p-4">
      <h3 class="text-center fw-bold mb-4 text-primary">🎫 文化祭 チケット予約</h3>
      
      <div class="mb-3">
        <label class="form-label fw-bold">1. 券種を選んでください</label>
        <div class="d-flex gap-2">
          <input type="radio" class="btn-check" name="ticketType" id="type-reserve" value="予約あり" checked onclick="toggleType()">
          <label class="btn btn-outline-primary w-50 p-3 fw-bold" for="type-reserve">事前予約枠</label>

          <input type="radio" class="btn-check" name="ticketType" id="type-normal" value="一般" onclick="toggleType()">
          <label class="btn btn-outline-primary w-50 p-3 fw-bold" for="type-normal">当日一般枠</label>
        </div>
      </div>

      <div id="time-slot-area" class="mb-3">
        <label class="form-label fw-bold">2. 希望の時間帯</label>
        <select id="time-select" class="form-select form-select-lg">
          <option value="">⏳ 残り数を読み込み中...</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">3. 申し込み人数</label>
        <select id="count-select" class="form-select form-select-lg">
          <option value="1">1名</option>
          <option value="2">2名 (最大)</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold">4. メールアドレス (任意)</label>
        <input type="email" id="email-input" class="form-select form-select-lg" placeholder="name@example.com">
      </div>

      <button id="submit-btn" class="btn btn-primary btn-lg w-100 p-3 fw-bold fs-4" onclick="submitReservation()">予約を確定する</button>
    </div>

    <div id="result-section" style="display:none;" class="card main-card shadow p-4 text-center">
      <h2 class="text-success fw-bold mb-3">🎉 予約が完了しました！</h2>
      <p class="fs-5 text-danger fw-bold">⚠️ 必ずこの画面の【スクリーンショット（画面保存）】を撮ってください！当日のレジ・受付で必要になります。</p>
      
      <div class="qr-area my-4 mx-auto" style="max-width: 280px;">
        <img id="qr-image" src="" alt="QRコード" class="img-fluid">
        <div id="ticket-id-display" class="fs-3 fw-bold mt-2 text-dark"></div>
      </div>

      <div class="alert alert-secondary text-start">
        <div><b>券種:</b> <span id="res-type"></span></div>
        <div><b>時間:</b> <span id="res-time"></span></div>
        <div><b>人数:</b> <span id="res-count"></span>名</div>
      </div>
      <p class="text-muted small">※メールは送信されません。この画面が唯一のチケットになります。</p>
    </div>
  </div>

  <script>
    // ⚠️ ご自身のGASウェブアプリのURLに差し替えてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyIaFnigkHG9mxCEEIYIcdbGA1Z_kMF_4KPpk1zAPZp2qZx12yeqEQxa82ORh3HGXYw/exec";

    // 画面起動時に残り枠数をリアルタイム取得
    async function loadSlots() {
      try {
        const res = await fetch(`${GAS_URL}?action=remaining&t=${new Date().getTime()}`);
        const data = await res.json();
        const select = document.getElementById('time-select');
        select.innerHTML = '';

        if (data.length === 0) {
          select.innerHTML = '<option value="">現在、すべての枠が満員です</option>';
          document.getElementById('submit-btn').disabled = true;
          return;
        }

        data.forEach(slot => {
          const opt = document.createElement('option');
          opt.value = slot.time;
          if (slot.remaining <= 0) {
            opt.innerText = `❌ ${slot.time} (満員)`;
            opt.disabled = true;
          } else {
            opt.innerText = `⭕ ${slot.time} (残り ${slot.remaining}組)`;
          }
          select.appendChild(opt);
        });
      } catch (e) {
        alert("残り枠数の取得に失敗しました。ページを再読み込みしてください。");
      }
    }

    function toggleType() {
      const isReserve = document.getElementById('type-reserve').checked;
      document.getElementById('time-slot-area').style.display = isReserve ? 'block' : 'none';
    }

    // 予約の送信処理
    async function submitReservation() {
      const type = document.querySelector('input[name="ticketType"]:checked').value;
      const time = document.getElementById('time-select').value;
      const count = document.getElementById('count-select').value;
      const email = document.getElementById('email-input').value.trim();

      if (type === "予約あり" && !time) {
        alert("希望の時間帯を選択してください。");
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = "予約処理中...";

      try {
        const url = `${GAS_URL}?action=reserve&type=${encodeURIComponent(type)}&time=${encodeURIComponent(time)}&count=${count}&email=${encodeURIComponent(email)}`;
        const res = await fetch(url);
        const result = await res.json();

        if (!result.success) {
          alert("予約に失敗しました: " + result.message);
          btn.disabled = false;
          btn.innerText = "予約を確定する";
          return;
        }

        // 予約成功 ➔ QRコード画面へ切り替え
        document.getElementById('ticket-id-display').innerText = result.id;
        document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${result.id}`;
        
        document.getElementById('res-type').innerText = type === "予約あり" ? "事前予約枠" : "当日一般枠";
        document.getElementById('res-time').innerText = type === "予約あり" ? time : "指定なし (当日順次)";
        document.getElementById('res-count').innerText = count;

        document.getElementById('form-section').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';
        window.scrollTo(0, 0);

      } catch (e) {
        alert("通信エラーが発生しました。時間を置いて再度お試しください。");
        btn.disabled = false;
        btn.innerText = "予約を確定する";
      }
    }

    window.onload = loadSlots;
  </script>
</body>
</html>
