<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>チケット予約 | 文化祭</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; font-family: sans-serif; }
    .card { border-radius: 15px; border: none; }
  </style>
</head>
<body>
  <div class="container py-4" style="max-width: 500px;">
    <div id="form-section" class="card shadow p-4">
      <h3 class="text-center fw-bold mb-4">🎫 チケット予約</h3>
      
      <div class="mb-3">
        <label class="form-label fw-bold">券種</label>
        <div class="btn-group w-100" role="group">
          <input type="radio" class="btn-check" name="type" id="t1" value="予約あり" checked onchange="toggleTime()">
          <label class="btn btn-outline-primary" for="t1">事前予約</label>
          <input type="radio" class="btn-check" name="type" id="t2" value="一般" onchange="toggleTime()">
          <label class="btn btn-outline-primary" for="t2">当日一般</label>
        </div>
      </div>

      <div id="time-group" class="mb-3">
        <label class="form-label fw-bold">時間帯</label>
        <select id="time-select" class="form-select"></select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">人数</label>
        <select id="count-select" class="form-select">
          <option value="1">1名</option>
          <option value="2">2名</option>
        </select>
      </div>

      <button id="submit-btn" class="btn btn-primary w-100 py-3 fw-bold" onclick="submitReservation()">予約を確定する</button>
    </div>

    <div id="result-section" class="card shadow p-4 text-center" style="display:none;">
      <h4 class="text-success fw-bold">🎉 予約完了！</h4>
      <p class="text-danger fw-bold small">※必ずこの画面をスクショしてください（再表示できません）</p>
      <img id="qr-image" class="img-fluid my-3 border p-2" src="" alt="QRコード">
      <div id="ticket-id" class="fs-4 fw-bold"></div>
    </div>
  </div>

  <script>
    // ⚠️ いただいたURLをそのままセットしています
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw_v3vt7QpmffCfFLBkqDs0nzy6hTO4WfJqz6dYjEf2xs8KZztgmssxETy9SDj7h648/exec";

    // 画面読み込み時に時間枠を取得
    async function init() {
      try {
        const res = await fetch(GAS_URL + "?action=remaining");
        const slots = await res.json();
        const select = document.getElementById('time-select');
        select.innerHTML = ""; // 初期化

        if (slots.length === 0) {
          select.innerHTML = '<option value="">設定シートにデータがありません</option>';
          return;
        }

        slots.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.time;
          opt.innerText = `${s.time} (残り ${s.remaining}組)`;
          if(s.remaining <= 0) opt.disabled = true;
          select.appendChild(opt);
        });
      } catch (e) {
        console.error(e);
        document.getElementById('time-select').innerHTML = '<option value="">通信エラーが発生しました</option>';
      }
    }

    function toggleTime() {
      document.getElementById('time-group').style.display = document.getElementById('t1').checked ? 'block' : 'none';
    }

    // 予約送信
    async function submitReservation() {
      const btn = document.getElementById('submit-btn');
      const type = document.querySelector('input[name="type"]:checked').value;
      const time = document.getElementById('time-select').value;
      const count = document.getElementById('count-select').value;

      if (type === "予約あり" && (!time || time === "通信エラーが発生しました")) {
        alert("有効な時間帯が選択されていません。");
        return;
      }

      btn.disabled = true;
      btn.innerText = "処理中...";

      const params = new URLSearchParams({
        action: 'reserve',
        type: type,
        time: time,
        count: count,
        email: "" // 今回はメール機能なし
      });

      try {
        const res = await fetch(GAS_URL + "?" + params.toString());
        const data = await res.json();

        if (data.success) {
          document.getElementById('form-section').style.display = 'none';
          document.getElementById('result-section').style.display = 'block';
          document.getElementById('ticket-id').innerText = "ID: " + data.id;
          document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${data.id}`;
        } else {
          // もしGAS内部でエラーが起きた場合は、ここで「GAS内部エラー: 〜〜」と表示されます
          alert("予約エラー: " + data.message);
          btn.disabled = false;
          btn.innerText = "予約を確定する";
        }
      } catch (e) {
        console.error(e);
        alert("通信エラーが発生しました。設定が「全員」になっているか確認してください。");
        btn.disabled = false;
        btn.innerText = "予約を確定する";
      }
    }

    window.onload = init;
  </script>
</body>
</html>
